/* VOICE: amigável e simples, como o contador explicando no balcão.
   IDEA: um caderninho de caixa no bolso, que o contador também enxerga.
   PICTURE: o próprio app — saldo grande, dois botões enormes "Recebi" e "Paguei".
   COLOUR and TYPE: marca JM — azul-marinho #0D1B3E, dourado #B8962E; Poppins + Montserrat.
   LAYOUT: coluna única de celular; barra de abas embaixo; painel do escritório mais largo. */
:root{color-scheme:light dark;
--bg:light-dark(#f3f4f8,#070c1a);--card:light-dark(#fff,#111a33);--ink:light-dark(#0D1B3E,#e9edf7);--mut:light-dark(#5b6584,#9ca7c6);
--line:light-dark(#e1e5ee,#23305a);--navy:#0D1B3E;--gold:#B8962E;--goldsoft:light-dark(#f7f0dd,#2a2410);
--in:light-dark(#0f7a4d,#5fd3a0);--inbg:light-dark(#e2f4ea,#0f2a20);--out:light-dark(#b42318,#ff8a80);--outbg:light-dark(#fde8e6,#2e1110);
--warn:light-dark(#9a5b00,#f0b45a);--warnbg:light-dark(#fdf1de,#2c1f0a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Montserrat,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3,.big,.brand{font-family:Poppins,system-ui,sans-serif;line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:26px}h2{font-size:19px}h3{font-size:16px}
button,input,select{font:inherit;font-size:16px;color:inherit}
button{cursor:pointer;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 16px;font-weight:600}
button:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
input,select{min-height:50px;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:0 14px;width:100%}
label{display:grid;gap:6px;font-size:14px;color:var(--mut);font-weight:500}
.pri{background:var(--gold);border-color:var(--gold);color:#fff}
.dk{background:var(--navy);border-color:var(--navy);color:#fff}
.lnk{border:0;background:none;color:var(--gold);min-height:40px;padding:0 4px;text-decoration:underline}
.w{width:100%}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 104px}
.wide{max-width:1100px}
.top{background:var(--navy);color:#fff;padding:18px 16px 22px}
.top .in{max-width:560px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
.wide-top .in{max-width:1100px}
.brand{font-size:20px;font-weight:700}.brand b{color:var(--gold)}
.top small{color:#b9c2dc;font-size:13px}
.top .hbtn{min-height:40px;min-width:40px;display:inline-flex;align-items:center;justify-content:center;border-radius:12px;background:#ffffff18;color:#fff;text-decoration:none;font-weight:700}
.top button{min-height:40px;background:#ffffff18;border:0;color:#fff;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:14px}
.saldo{background:var(--navy);color:#fff;border:0;margin-top:-10px}
.saldo .l{color:#b9c2dc;font-size:14px}
.saldo .big{font-size:clamp(32px,9vw,42px);font-weight:700;margin:4px 0 10px;white-space:nowrap}
.saldo .row{display:flex;gap:18px;font-size:14px;flex-wrap:wrap}.saldo .row b{font-family:Poppins}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.act{min-height:86px;border-radius:18px;font-family:Poppins;font-size:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.act small{font:500 13px Montserrat;opacity:.85}
.act.in{background:var(--in);border-color:var(--in);color:#fff}.act.out{background:var(--out);border-color:var(--out);color:#fff}
.bar{height:12px;background:var(--line);border-radius:99px;overflow:hidden;margin:10px 0 6px}.bar i{display:block;height:100%;border-radius:99px;background:var(--gold)}
.bar i.hi{background:var(--warn)}.bar i.over{background:var(--out)}
.mut{color:var(--mut);font-size:14px}
.tip{background:var(--goldsoft);border-radius:14px;padding:12px 14px;margin-top:14px;font-size:15px;display:flex;gap:10px;align-items:flex-start}
.tip b{color:var(--gold)}.tip p{margin:0;flex:1}.tip button{min-height:36px;font-size:14px;padding:0 12px;flex:none}
.pill{display:inline-block;font-size:13px;font-weight:600;padding:3px 10px;border-radius:99px;white-space:nowrap}
.p-in{background:var(--inbg);color:var(--in)}.p-out{background:var(--outbg);color:var(--out)}.p-w{background:var(--warnbg);color:var(--warn)}.p-g{background:var(--goldsoft);color:var(--gold)}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}.li>div:first-child{flex:1 1 auto;min-width:0;overflow-wrap:anywhere}.li>div:last-child{flex:none}
.li .d{font-size:13px;color:var(--mut)}
.v{font-family:Poppins;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.v.in{color:var(--in)}.v.out{color:var(--out)}
.x{min-height:36px;width:36px;padding:0;border-radius:10px;font-size:18px;color:var(--mut)}
.day{font-size:13px;font-weight:600;color:var(--mut);margin-top:14px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(var(--nt,5),1fr);padding:6px max(6px,env(safe-area-inset-left)) max(6px,env(safe-area-inset-bottom));z-index:5}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;color:var(--mut);text-decoration:none;font-size:12px;font-weight:600}

nav.tabs svg{width:24px;height:24px}
.sheet{position:fixed;inset:0;background:#0d1b3e99;display:none;align-items:flex-end;justify-content:center;z-index:9}
.sheet.on{display:flex}
.sheet .box{background:var(--bg);width:min(560px,100%);border-radius:22px 22px 0 0;padding:18px 16px max(18px,env(safe-area-inset-bottom));max-height:94vh;overflow:auto}
.sheet .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.money{font-family:Poppins;font-size:34px;font-weight:700;text-align:center;min-height:68px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;border-radius:99px;font-weight:500;font-size:15px;padding:0 14px}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.grp{margin-top:16px}.grp>.t{font-size:14px;font-weight:600;color:var(--mut);margin-bottom:8px}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.yn button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.center{min-height:100vh;display:grid;place-items:center;padding:20px}
.auth{width:min(420px,100%)}
.auth .logo{font-family:Poppins;font-size:30px;font-weight:700;text-align:center}.auth .logo b{color:var(--gold)}
.auth .slogan{text-align:center;color:var(--mut);margin:4px 0 20px}
.stack{display:grid;gap:12px}
.err{background:var(--outbg);color:var(--out);border-radius:12px;padding:10px 12px;font-size:14px}

.steps{display:flex;gap:6px;justify-content:center;margin-bottom:14px}.steps i{width:28px;height:6px;border-radius:9px;background:var(--line)}.steps i.on{background:var(--gold)}
.opt{display:grid;gap:10px}.opt button{min-height:64px;text-align:left;font-weight:500;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px}
.opt button b{font-family:Poppins;font-size:17px}.opt button.on{border:2px solid var(--gold);background:var(--goldsoft)}
.rel table{width:100%;border-collapse:collapse;font-size:15px}.rel td{padding:9px 4px;border-bottom:1px solid var(--line)}.rel td:last-child{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.rel tr.h td,.rel tr.h td:last-child{text-align:left}.rel tr.t td{font-weight:700;font-family:Poppins}.rel tr.h td{font-weight:600;color:var(--mut);font-size:13px;padding-top:16px}
.mnav{display:flex;justify-content:space-between;align-items:center;gap:8px}.mnav button{min-height:44px;width:44px;padding:0;font-size:20px}
.toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:12px;font-size:15px;display:none;z-index:20;max-width:92vw;text-align:center}
.toast.on{display:block}
.demo{position:fixed;top:0;left:50%;transform:translateX(-50%);background:var(--gold);color:#fff;font-size:12px;font-weight:600;padding:2px 12px;border-radius:0 0 10px 10px;z-index:30}
table.adm{width:100%;border-collapse:collapse;font-size:15px}
table.adm th{text-align:left;font-size:13px;color:var(--mut);padding:8px;border-bottom:1px solid var(--line)}
table.adm td{padding:10px 8px;border-bottom:1px solid var(--line)}
.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
.kp{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kp .card{margin:0}.kp .big{font-size:24px;font-weight:700;margin-top:4px}
@media(max-width:700px){.kp{grid-template-columns:repeat(2,minmax(0,1fr))}.cv{grid-template-columns:minmax(0,1fr)!important}
.stk thead{display:none}.stk tr{display:grid;padding:8px 0;border-bottom:1px solid var(--line)}.stk td{border:0;padding:2px 0;text-align:left}}
@media (prefers-reduced-motion:no-preference){.sheet.on .box{animation:up .22s ease-out}@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}}

.pdv{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
.prod{text-align:left;height:auto;padding:12px;display:flex;flex-direction:column;gap:4px;border-radius:14px;font-weight:400}
.prod b{font-size:15px;line-height:1.25}.prod .pr{font-family:Poppins;font-weight:600;font-size:17px}.prod small{color:var(--mut);font-size:13px}.prod small.neg{color:var(--out)}
.cart{position:sticky;top:14px;margin-top:0}
.ci{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:15px}
.qty{display:flex;gap:6px;align-items:center;justify-content:flex-end}.qty button{min-height:36px;width:36px;padding:0}
.tot{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:14px 0}.tot .big{font-family:Poppins;font-size:30px;font-weight:700;white-space:nowrap}
.grade{display:grid;gap:6px;align-items:center;text-align:center}.grade button{min-height:52px;padding:0;font-size:17px}.grade button.zero{opacity:.55}
table.vt{width:100%;border-collapse:collapse;font-size:14px}table.vt th{text-align:left;color:var(--mut);font-size:13px;padding:6px 4px}table.vt td{padding:4px}
.cupom-tela{background:#fffdf7;color:#111;border-radius:8px;padding:14px;font:13px/1.45 "Courier New",monospace;max-width:340px;margin:0 auto}
.danfe .qr svg{width:100%;height:auto;display:block}.cupom hr{border:0;border-top:1px dashed #888;margin:6px 0}.cupom .r{display:flex;justify-content:space-between;gap:8px}
/* painel da loja */
.lt{background:var(--navy);color:#fff;position:sticky;top:0;z-index:30;box-shadow:0 1px 0 #ffffff14}
.lt-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px}
.lt-b{min-height:42px;min-width:42px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:12px;background:#ffffff14;border:1px solid #ffffff1f;color:#fff;text-decoration:none}
.lt-b svg{width:21px;height:21px}.lt-b:hover{background:#ffffff26}.lt-b.raio{color:var(--gold)}.lt-b.raio.on{background:var(--gold);color:var(--navy)}
.lt-brand{color:#fff;text-decoration:none;font:700 19px/1.1 Poppins,sans-serif;display:grid;white-space:nowrap}.lt-brand b{color:var(--gold)}.lt-brand small{font:500 12px Montserrat,sans-serif;color:#b9c2dc;max-width:180px;overflow:hidden;text-overflow:ellipsis}
.lt-busca{flex:1;max-width:560px;margin:0 auto;min-height:42px;display:flex;align-items:center;gap:10px;background:#fff;color:#5b6584;border:0;border-radius:999px;padding:0 8px 0 16px;font-weight:500;font-size:15px;text-align:left}
.lt-busca svg{width:18px;height:18px;color:var(--gold);flex:none}.lt-busca span{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
kbd{font:600 11px/1 Montserrat,sans-serif;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:4px 6px;color:var(--mut);background:var(--card);white-space:nowrap}
.lt-busca kbd{color:#5b6584;background:#f3f4f8;border-color:#d8dde8}
.lt-ic{display:flex;gap:8px;align-items:center}.lt-busca-m{display:none}.lt-ac{position:relative}
.qmenu{position:absolute;right:0;top:52px;width:330px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 40px #0d1b3e33;padding:8px;z-index:40}
.qm-hd{display:flex;align-items:center;gap:8px;padding:8px 10px 10px;border-bottom:1px solid var(--line);margin-bottom:4px}.qm-hd svg{width:18px;height:18px;color:var(--gold)}

.qmenu button:hover,.bk-it:hover,.bk-it.on{background:var(--goldsoft)}
.qmenu b,.bk-it b{display:block;font-size:15px}.qmenu small,.bk-it small{display:block;color:var(--mut);font-size:12.5px;line-height:1.3}

.gav-fundo{position:fixed;inset:0;background:#0d1b3e66;z-index:50}
.gav{position:fixed;top:0;bottom:0;left:0;width:min(310px,88vw);background:var(--card);z-index:51;display:flex;flex-direction:column;box-shadow:8px 0 30px #0d1b3e33;animation:gav .18s ease-out}
@keyframes gav{from{transform:translateX(-30px);opacity:.4}}@media (prefers-reduced-motion:reduce){.gav{animation:none}}

.gav-perfil b{display:block;font:700 17px Poppins,sans-serif;line-height:1.2}.gav-perfil small{display:block;color:#b9c2dc;font-size:12.5px;margin-top:3px;overflow:hidden;text-overflow:ellipsis}
.gav-perfil .x{position:absolute;top:8px;right:8px;background:#ffffff1a;color:#fff;border:0}
.gav-av{flex:none;width:46px;height:46px;border-radius:50%;background:var(--gold);color:var(--navy);display:grid;place-items:center;font:700 17px Poppins,sans-serif}
.gav-nav{flex:1;overflow:auto;padding:0 10px}
.gav details{border-bottom:1px solid var(--line);padding:6px 0}.gav summary{cursor:pointer;color:var(--mut);font-size:13px;font-weight:600;padding:8px 6px;list-style:none;display:flex;justify-content:space-between}

.wrap.lw{max-width:1240px}
.painel{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}

const soDig=s=>String(s||'').replace(/\D/g,'');
const fmtCNPJ=s=>{const d=soDig(s).slice(0,14);return d.replace(/^(\d{2})(\d)/,'$1.$2').replace(/^(\d{2})\.(\d{3})(\d)/,'$1.$2.$3').replace(/\.(\d{3})(\d)/,'.$1/$2').replace(/(\d{4})(\d)/,'$1-$2')};
function cnpjOk(c){const d=soDig(c);if(d.length!==14||/^(\d)\1+$/.test(d))return false;
 const dv=n=>{let s=0,p=n-7;for(let i=0;i<n;i++){s+=+d[i]*p--;if(p<2)p=9}const r=s%11;return r<2?0:11-r};return dv(12)===+d[12]&&dv(13)===+d[13]}
// tira CPF e números da razão social (MEI antigo traz o CPF no nome) — o app nunca guarda CPF
const semCPF=s=>String(s||'').replace(/\d{3}\.?\d{3}\.?\d{3}-?\d{2}/g,'').replace(/\s{2,}/g,' ').trim();
const nomeDeRazao=s=>{const t=semCPF(s).replace(/^\d{2}\.?\d{3}\.?\d{3}\s*/,'').replace(/\s+\d+$/,'').trim().toLowerCase();
 return t.replace(/(^|\s)(\S)/g,(m,a,b)=>a+b.toUpperCase()).replace(/\s(De|Da|Do|Das|Dos|E)(?=\s)/g,m=>m.toLowerCase())};

 try{const j=await fx('https://brasilapi.com.br/api/cnpj/v1/'+d);
  return {razao:j.razao_social,fantasia:j.nome_fantasia||'',situacao:j.descricao_situacao_cadastral||'',mei:!!j.opcao_pelo_mei,abertura:j.data_inicio_atividade||'',cnae:String(j.cnae_fiscal||''),cnaeDesc:j.cnae_fiscal_descricao||'',cidade:j.municipio||'',uf:j.uf||''}}

  const j=await fx('https://publica.cnpj.ws/cnpj/'+d),es=j.estabelecimento||{};
  return {razao:j.razao_social,fantasia:es.nome_fantasia||'',situacao:es.situacao_cadastral||'',mei:(j.simples||{}).mei==='Sim',abertura:es.data_inicio_atividade||'',cnae:soDig((es.atividade_principal||{}).subclasse||(es.atividade_principal||{}).id),cnaeDesc:(es.atividade_principal||{}).descricao||'',cidade:(es.cidade||{}).nome||'',uf:(es.estado||{}).sigla||''}}}
function ramoDoCnae(c){c=String(c||'');const CN=[['4330404','pintor'],['4399103','pedreiro'],['4321500','eletricista'],['4322301','encanador'],['8130300','jardineiro'],['8121400','limpeza'],['9511800','assistencia'],['9512600','assistencia'],['9521500','assistencia'],['9602501','salao'],['9602502','unhas'],['5611','lanches'],['4711','mercado'],['4712','mercado']].find(([p])=>c.startsWith(p));if(CN)return{ramo:CN[1],tipo:RAMOS[CN[1]].tipo};if(c.startsWith('4520')||c.startsWith('4530')||c.startsWith('4543'))return{ramo:'oficina',tipo:'ambos'};

document.addEventListener('click',async e=>{

 if(ds.agapaga){const a=A(ds.agapaga);confirmar('Apagar o horário de '+a.cli+'?'+(a.status==='feito'?' O recebimento continua no caixa.':''),async()=>{try{await API.delAgenda(S.user.uid,a.id);AG.lista=AG.lista.filter(x=>x!==a);render();toast('Horário apagado')}catch(err){toast(errMsg(err))}});return}

/* ===================== CREDIÁRIO / FIADO (loja) ===================== */
const CR={lista:[],ok:false,sh:null};
const addMes=(d,n)=>{const [y,m,dd]=d.split('-').map(Number);const x=new Date(y,m-1+n,1);const ult=new Date(x.getFullYear(),x.getMonth()+1,0).getDate();return x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(Math.min(dd,ult))};
async function carregarCred(){if(!S.user||S.isAdmin)return;try{CR.lista=await API.listCred(S.user.uid);CR.ok=true}catch(e){CR.ok=false}}
const abertas=c=>(c.parcelas||[]).filter(p=>!p.pago);
const saldoCred=c=>abertas(c).reduce((s,p)=>s+(+p.valor||0),0);
function resumoCred(){const h=hoje(),sem=addDia(h,7);let rec=0,atr=0,semana=0,nAtr=new Set();
 for(const c of CR.lista)for(const p of abertas(c)){rec+=+p.valor||0;if(p.venc<h){atr+=+p.valor||0;nAtr.add(c.cli.toLowerCase())}else if(p.venc<=sem)semana+=+p.valor||0}
 return{rec,atr,semana,nAtr:nAtr.size}}
const modX=k=>S.emp&&S.emp.mods&&S.emp.mods[k]!==undefined;
const usaCred=()=>modX('cred')?!!S.emp.mods.cred:S.emp&&(S.emp.ramo?preset(S.emp.ramo,'cred'):(S.emp.tipo==='comercio'||S.emp.tipo==='ambos'))||CR.lista.length>0;
const usaAgenda=()=>modX('agenda')?!!S.emp.mods.agenda:S.emp&&(S.emp.ramo?preset(S.emp.ramo,'agenda'):(S.emp.tipo==='servico'||S.emp.tipo==='ambos'))||AG.lista.length>0;
function vFiado(){
 const r=resumoCred(),h=hoje();
 /* agrupa por cliente */
 const G={};for(const c of CR.lista){const k=c.cli.trim().toLowerCase();(G[k]=G[k]||{cli:c.cli,fone:c.fone,vendas:[]}).vendas.push(c);if(c.fone)G[k].fone=c.fone}
 const cls=Object.values(G).map(g=>{const ps=g.vendas.flatMap(v=>abertas(v));return{...g,saldo:ps.reduce((s,p)=>s+(+p.valor||0),0),prox:ps.map(p=>p.venc).sort()[0]||'',atr:ps.filter(p=>p.venc<h).reduce((s,p)=>s+(+p.valor||0),0)}}).filter(g=>g.saldo>0||S._crTodos).sort((a,b)=>(b.atr>0)-(a.atr>0)||(a.prox||'9').localeCompare(b.prox||'9'));
 const quitadas=Object.values(G).filter(g=>!g.vendas.some(v=>abertas(v).length)).length;
 return shell(`
  <div class="card saldo"><div class="l">Crediário · tenho a receber</div><div class="big">${brl(r.rec)}</div>
   <div class="row"><span>Atrasado <b>${brl(r.atr)}</b></span><span>Vence em 7 dias <b>${brl(r.semana)}</b></span></div></div>

async function cancelarVenda(id){const v=LJ.vendas.find(x=>x.id===id);if(!v)return;

async function desfazerVenda(v){try{

 catch(x){if(x.name==='AbortError')throw new Error('O programa da nota demorou demais para responder.');if(x instanceof TypeError)throw new Error('Não encontrei o programa da nota. Use o computador do balcão e confira se a janela "Nota fiscal" está aberta.');throw x}

  partes.push(h,nome,dados);const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint32(16,crc,true);c.setUint32(20,dados.length,true);c.setUint32(24,dados.length,true);c.setUint16(28,nome.length,true);c.setUint32(42,off,true);
  dir.push(c,nome);off+=30+nome.length+dados.length}

function conferirNota(e){const d=e.dest,er=[],doc=soDig(d.doc);
 if(!(doc.length===11?cpfOk(doc):cnpjOk(doc)))er.push('CPF ou CNPJ válido');if(!d.nome.trim())er.push('nome');
 if(d.indIEDest==='1'&&!soDig(d.ie))er.push('Inscrição Estadual (ou mude para isento/não contribuinte)');
 if(!d.lgr.trim()||!d.bairro.trim()||!d.mun.trim())er.push('endereço completo (rua, bairro e cidade)');
 if(!e.itens.length)er.push('pelo menos um produto');
 e.itens.forEach(i=>{if(!(+i.qtd>0)||!(+i.preco>0))er.push('quantidade e valor de '+(i.nome||'item'));if(soDig(i.ncm).length!==8)er.push('NCM de '+(i.nome||'item'))});
 if(e.tipo==='devolucao'&&soDig(e.refNFe).length!==44)er.push('chave da nota de compra com 44 números');
 return [...new Set(er)]}

  credSN:!fin&&n.dest.indIEDest==='1'&&cred>0?cred:0,infCpl:n.infCpl||'',pags:[{forma:n.pag.forma,valor:T.tot,prazo:!!n.pag.prazo}],
  pedido:(n.pedido||'').trim(),itens:n.itens.map(i=>({pid:i.pid||'',cod:i.cod||((LJ.prods.find(p=>p.id===i.pid)||{}).ref)||'',nome:i.nome,var:i.var||'',qtd:+i.qtd,preco:+i.preco,ncm:soDig(i.ncm),cfop:soDig(i.cfop)||cfopSug(n,i),csosn:i.csosn||'102',orig:i.orig||'0',un:i.un||'UN',ean:i.ean||'',
   vICMS:+i.vICMS||0,pICMS:+i.pICMS||0,vBC:+i.vICMS?Math.round((+i.qtd)*(+i.preco)*100)/100:0,vIPIDevol:+i.vIPIDevol||0}))}}
async function salvarNota(emitir){const e=NT.ed,er=$('#neerr'),msg=m=>{er.innerHTML=`<div class="err" style="margin:0 0 10px">${m}</div>`;er.scrollIntoView({block:'center'})};

   if(n.origemVenda){const v=LJ.vendas.find(x=>x.id===n.origemVenda);const vn={st:'nfe',nNF:nf.nNF,chave:nf.chave,notaId:n.id};if(v)v.nfce=vn;await API.updVenda(S.user.uid,n.origemVenda,{nfce:vn})}}
  await API.saveNota(S.user.uid,{...n,...up})}catch(x){toast('A nota saiu, mas não consegui salvar tudo no sistema: '+errMsg(x))}

 if(nf.st==='autorizada'){toast('NF-e nº '+nf.nNF+' autorizada');if(S.emp.nfceImp!==false)imprimir(danfeA4(n),'p-a4')}else toast('NF-e não emitida: '+nf.msg.slice(0,140))}

/* XMLs do mês: loja e escritório */
function arqsXML(vendas,notas,mes){const A=[];
 vendas.filter(v=>v.nfce&&v.nfce.xml&&v.data.startsWith(mes)).forEach(v=>{A.push({nome:'NFCe/'+v.nfce.chave+'-nfce.xml',texto:v.nfce.xml});if(v.nfce.st==='cancelada')A.push({nome:'NFCe/'+v.nfce.chave+'-CANCELADA.txt',texto:'NFC-e cancelada em '+v.nfce.canceladaEm+'. Protocolo: '+(v.nfce.nProtCanc||'')+'. Motivo: '+(v.nfce.just||'')})});
 notas.filter(n=>n.nfe&&n.nfe.xml&&n.data.startsWith(mes)).forEach(n=>{A.push({nome:'NFe/'+n.nfe.chave+'-nfe.xml',texto:n.nfe.xml});(n.cces||[]).forEach(c=>c.xml&&A.push({nome:'NFe/'+n.nfe.chave+'-CCe'+c.seq+'.xml',texto:c.xml}));
  if(n.nfe.st==='cancelada')A.push({nome:'NFe/'+n.nfe.chave+'-CANCELADA.txt',texto:'NF-e cancelada em '+n.nfe.canceladaEm+'. Protocolo: '+(n.nfe.nProtCanc||'')+'. Motivo: '+(n.nfe.just||'')})});
 return A}
function baixarZip(arqs,nome){if(!arqs.length){toast('Nenhuma nota autorizada nesse mês');return}const a=document.createElement('a');a.href=URL.createObjectURL(zipar(arqs));a.download=nome;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}

 catch(x){toast('Não consegui ler as notas: '+errMsg(x))}}

 if(t.id==='nesalva'){salvarNota(false);return}
 if(t.id==='neemite'){salvarNota(true);return}

 if(ds.needit){const n=NT.lista.find(x=>x.id===ds.needit);fecharSheet();NT.ed=JSON.parse(JSON.stringify(n));render();return}
 if(ds.nedesc){const n=NT.lista.find(x=>x.id===ds.nedesc);fecharSheet();confirmar('Descartar esta nota? Ela some da lista.',async()=>{n.nfe={...(n.nfe||{}),st:'descartada'};await API.saveNota(S.user.uid,n);render()},'Descartar');return}

 if(ds.vnfe){const v=LJ.vendas.find(x=>x.id===ds.vnfe);fecharSheet();if(v)notaDeVenda(v);return}

});

/* números ao vivo de cada bloco */
function metricaTela(k){try{const h=hoje(),mes=h.slice(0,7);
 if(k==='vender'){const V=vendasDia(h),t=V.reduce((s,v)=>s+v.total,0);return V.length?`Hoje: <b>${brl(t)}</b> em ${V.length} venda${V.length>1?'s':''}`:'Nenhuma venda hoje ainda'}

 if(k==='clientes'){const n=todosClientes().length;return n?`${n} cliente${n>1?'s':''}`:''}
 if(k==='produtos'){const at=LJ.prods.filter(p=>p.ativo!==false),b=at.flatMap(p=>(p.vars||[]).filter(v=>(+v.est||0)<=1)).length;return `${at.length} produto${at.length===1?'':'s'}${b?` · <b class="neg">${b} acabando</b>`:''}`}
 if(k==='despesa'){const s=soma(doMes(S.lanc,+h.slice(0,4),+h.slice(5,7)),'out');return s?`Saiu no mês: ${brl(s)}`:''}
 if(k==='fiado'){const r=resumoCred();return r.rec?`<b>${brl(r.rec)}</b> a receber${r.atr?` · <b class="neg">${brl(r.atr)} atrasado</b>`:''}`:'Ninguém devendo'}
 if(k==='vendas'){const n=LJ.vendas.filter(v=>!v.cancelada&&v.data.startsWith(mes)).length;return n?`${n} no mês`:''}
 if(k==='extrato'){const L=doMes(S.lanc,+h.slice(0,4),+h.slice(5,7)),s=soma(L,'in')-soma(L,'out');return `Saldo do mês: <b class="${s<0?'neg':''}">${brl(s)}</b>`}

 if(!S.emp)return emailOk()?telaOnboarding():telaVerifique();
 if(S.emp.bloqueado)return telaBloqueado();
 const h=location.hash.slice(1);S.tab=[...abas().map(x=>x[0]),...(usaLoja()?['vendas','extrato','relatorio','ajuda',...(fiscalOk()?['nfce','nfe']:[])]:[])].includes(h)?h:'inicio';
 $('#app').innerHTML=({vender:vVender,produtos:vProdutos,vendas:vVendas,mais:vMais,nfce:vNFCe,nfe:vNFe,inicio:vInicio,agenda:vAgenda,os:vOS,fixos:vFixos,fiado:vFiado,clientes:vClientes,extrato:vExtrato,relatorio:vRelatorio,ajuda:vAjuda})[S.tab]();
 if(S.tab==='vender')focoPDV();
 const dc=$('#daschk');if(dc)dc.onchange=async()=>{S.emp.dasLembrete=dc.checked;await API.saveEmp(S.user.uid,{dasLembrete:dc.checked});toast('Preferência salva')};
}
async function mudaMes(d){S.mes+=d;if(S.mes<1){S.mes=12;S.ano--}if(S.mes>12){S.mes=1;S.ano++}
 if(!S.isAdmin&&!S.lanc.some(l=>l.data.startsWith(S.ano+'-'))){S.lanc=await API.listLanc(S.user.uid,S.ano)}render()}
function bindAdmin(){
 const f=$('#fconv');if(f)f.onsubmit=async e=>{e.preventDefault();const d=new FormData(f);try{await API.addConv(d.get('email'),d.get('nome').trim());S.admin.conv=await API.listConv();render();toast('Convite criado. Toque em "Mensagem" para enviar ao cliente.')}catch(err){toast(errMsg(err))}}}

document.addEventListener('click',async e=>{
 const t=e.target.closest('button,[data-modo]');if(!t)return;const ds=t.dataset;
 if(ds.modo){telaLogin(ds.modo);return}
 if(ds.demoent){const u={uid:ds.demoent,email:ds.demoent.replace('demo-','')+'@exemplo.com'};demoStore.set('sess',u);iniciar(u);return}
 if(t.id==='sair'){await API.logout();S.user=null;S.emp=null;S.isAdmin=false;location.hash='';if(DEMO)telaLogin();return}
 if(t.id==='obg'){obNext();return}
 if(t.id==='obv'){S.ob.step--;telaOnboarding();return}
 if(ds.tipo&&!S.emp){S.ob.tipo=ds.tipo;telaOnboarding();return}
 if(ds.obramo&&!S.emp){if(S.ob.ramo!==ds.obramo)S.ob.mods=null;S.ob.ramo=ds.obramo;telaOnboarding();return}
 if(ds.obmei&&!S.emp){S.ob.mei=ds.obmei==='1';telaOnboarding();return}
 if(ds.obmod&&!S.emp){S.ob.mods[ds.obmod]=!S.ob.mods[ds.obmod];telaOnboarding();return}
 if(ds.das&&!S.emp){S.ob.das=ds.das==='1';telaOnboarding();return}
 if(ds.dica){S.emp.dicas={...(S.emp.dicas||{}),[ds.dica]:true};API.saveEmp(S.user.uid,{dicas:S.emp.dicas});render();return}
 if(t.id==='revdicas'){S.emp.dicas={};await API.saveEmp(S.user.uid,{dicas:{}});toast('As dicas vão aparecer de novo');go('inicio');return}
 if(ds.novo){abrirNovo(ds.novo);return}
 if(ds.das&&S.emp){abrirNovo('out',{cat:'das',desc:'DAS de '+(dasInfo(S.lanc).comp||''),valor:''});return}
 if(t.id==='shx'){fecharSheet();return}
 if(ds.cat){guardaCampos();S.sh.cat=ds.cat;if(!isFat({tipo:'in',cat:ds.cat}))S.sh.nota=false;renderSheet();return}
 if(ds.forma){guardaCampos();S.sh.forma=ds.forma;renderSheet();return}
 if(ds.nota&&S.sh){guardaCampos();S.sh.nota=ds.nota==='1';renderSheet();return}
 if(t.id==='salvar'){salvarLanc();return}
 if(ds.del){const l=S.lanc.find(x=>String(x.id)===ds.del);confirmar('Apagar '+(l.tipo==='in'?'recebimento':'pagamento')+' de '+brl(l.valor)+'?',async()=>{try{await API.delLanc(S.user.uid,l.id);S.lanc=S.lanc.filter(x=>x!==l);render();toast('Lançamento apagado')}catch(err){toast(errMsg(err))}});return}
 if(ds.mes){mudaMes(+ds.mes);return}
 if(t.id==='relcopy'){const tx=$('#relbox').innerText;try{await navigator.clipboard.writeText(tx);toast('Relatório copiado')}catch(err){toast('Não deu para copiar neste aparelho')}return}
 if(t.id==='relprint'){try{window.print()}catch(err){toast('Impressão indisponível aqui')}return}
 if(ds.ver){S.admin.sel=ds.ver;S.ano=new Date().getFullYear();S.mes=new Date().getMonth()+1;S.admin.lanc=await API.listLanc(ds.ver,S.ano);render();setTimeout(()=>$('#det')?.scrollIntoView({behavior:'smooth'}),50);return}
 if(t.id==='fechadet'){S.admin.sel=null;render();return}
 if(ds.ames){S.mes+=+ds.ames;if(S.mes<1){S.mes=12;S.ano--}if(S.mes>12){S.mes=1;S.ano++}S.admin.lanc=await API.listLanc(S.admin.sel,S.ano);render();return}
 if(ds.delconv){confirmar('Remover o convite de '+ds.delconv+'?',async()=>{await API.delConv(ds.delconv);S.admin.conv=await API.listConv();render()},'Remover');return}
 if(ds.msg){const c=S.admin.conv.find(x=>x.email===ds.msg),m=msgConvite(c);
  $('#sbox').innerHTML=`<div class="hd"><h2>Mensagem para ${esc(c.nome||c.email)}</h2><button class="x" id="shx" aria-label="Fechar">×</button></div><textarea id="msgtx" style="width:100%;min-height:220px;font:15px/1.5 Montserrat,sans-serif;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--card);color:var(--ink)">${esc(m)}</textarea><button class="pri w" id="cpmsg" style="margin-top:10px">Copiar mensagem</button>`;
  $('#sheet').classList.add('on');return}
 if(t.id==='cpmsg'){try{await navigator.clipboard.writeText($('#msgtx').value);toast('Mensagem copiada. Cole no WhatsApp do cliente.')}catch(err){$('#msgtx').select();toast('Selecionei o texto: copie com o dedo ou Ctrl+C')}return}
});
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')fecharSheet()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#sheet').classList.contains('on'))fecharSheet();if(e.key==='Enter'&&S.sh&&e.target.tagName==='INPUT'){e.preventDefault();salvarLanc()}});
window.addEventListener('hashchange',()=>{if(S.user&&!S.isAdmin&&S.emp){fecharSheet();render();scrollTo(0,0)}});

async function iniciar(u){
 S.user=u;if(!u){render();return}
 S.isAdmin=isAdminEmail(u.email);
 $('#app').innerHTML='<div class="center"><p class="mut">Carregando…</p></div>';
 try{
  if(S.isAdmin){await carregarAdmin()}
  else{S.emp=await API.getEmp(u.uid);if(S.emp){S.lanc=await API.listLanc(u.uid,S.ano);await Promise.all([carregarAgenda(),carregarCred(),carregarOS(),carregarLoja()])}}
  render()}
 catch(err){$('#app').innerHTML=`<div class="center"><div class="auth card"><div class="err">${esc(errMsg(err))}</div><button class="w" style="margin-top:12px" id="sair">Voltar</button></div></div>`}
}

(async()=>{
 if(DEMO){const b=document.createElement('div');b.className='demo';b.textContent='Demonstração';document.body.appendChild(b)}
 try{await API.init()}catch(err){$('#app').innerHTML=`<div class="center"><div class="auth card"><div class="err">${esc(errMsg(err))}</div></div></div>`;return}
 API.onUser(iniciar);
})();
}
</script>
<script>
/* ===== app instalável: registra o service worker e oferece "Instalar" uma vez por aparelho ===== */
(function(){
  if('serviceWorker' in navigator)window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})});
  const instalado=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
  const dispensou=()=>{try{return localStorage.getItem('pwa-dispensa')==='1'}catch(e){return false}};
  const dispensar=()=>{try{localStorage.setItem('pwa-dispensa','1')}catch(e){}};
  function faixa(texto,botoes){if(document.getElementById('pwabar'))return;const b=document.createElement('div');b.id='pwabar';b.setAttribute('role','dialog');b.setAttribute('aria-label','Instalar o app');
    b.style.cssText='position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));max-width:460px;margin:0 auto;z-index:9998;background:#0D1B3E;color:#fff;border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;box-shadow:0 10px 30px rgba(0,0,0,.3);font:14px/1.4 system-ui,sans-serif';
    const s=document.createElement('span');s.style.cssText='flex:1;min-width:180px';s.textContent=texto;b.appendChild(s);
    for(const [t,fn,prim] of botoes){const x=document.createElement('button');x.type='button';x.textContent=t;x.style.cssText='border:0;border-radius:10px;padding:8px 14px;font-weight:700;cursor:pointer;min-height:40px;'+(prim?'background:#B8962E;color:#0D1B3E':'background:transparent;color:#cbd5e1;border:1px solid #475569');x.onclick=()=>{b.remove();fn&&fn()};b.appendChild(x)}
    document.body.appendChild(b)}
  let ev=null;
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();ev=e;if(instalado()||dispensou())return;
    setTimeout(()=>faixa('Instale o app: ícone na tela inicial e abre em tela cheia.',[['Instalar',async()=>{ev.prompt();try{await ev.userChoice}catch(e){}ev=null}, true],['Agora não',dispensar]]),4000)});
  window.addEventListener('appinstalled',()=>{dispensar();const b=document.getElementById('pwabar');if(b)b.remove()});
  // iPhone/iPad no Safari não tem botão automático: mostra como fazer, uma vez
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent)&&!/crios|fxios|edgios/i.test(navigator.userAgent);
  if(ios&&!instalado()&&!dispensou())window.addEventListener('load',()=>setTimeout(()=>faixa('Para instalar: toque em Compartilhar e depois em "Adicionar à Tela de Início".',[['Entendi',dispensar,true]]),5000));
  window.JM_INSTALAR=()=>{if(ev){ev.prompt();ev=null;return true}return false};
})();
</script>
