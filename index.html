  const v='10.12.5',base='https://www.gstatic.com/firebasejs/'+v+'/';
  for(const f of ['firebase-app-compat.js','firebase-auth-compat.js','firebase-firestore-compat.js'])await new Promise((ok,no)=>{const s=document.createElement('script');s.src=base+f;s.onload=ok;s.onerror=()=>no(new Error('Sem conexão com o servidor'));document.head.appendChild(s)});
  fb=window.firebase;fb.initializeApp(FIREBASE_CONFIG);auth=fb.auth();auth.languageCode='pt';db=fb.firestore();
  try{await db.enablePersistence({synchronizeTabs:true})}catch(e){}
 },
 onUser(cb){
  if(DEMO){const u=demoStore.get('sess',null);setTimeout(()=>cb(u),0);return}
  auth.onAuthStateChanged(u=>{if(S.busy)return;cb(u?{uid:u.uid,email:(u.email||'').toLowerCase()}:null)});
 },
 async login(email,senha){
  email=email.trim().toLowerCase();
  if(DEMO){
   if(isAdminEmail(email)){const u={uid:'admin',email};demoStore.set('sess',u);return u}
   const c=demoStore.get('convites',[]).find(c=>c.email===email);if(!c)throw new Error('Este e-mail não tem acesso. Peça o convite ao escritório.');
   const uid=email==='bella@exemplo.com'?'demo-mei':email==='silva@exemplo.com'?'demo-2':'u_'+email.replace(/\W/g,'');
   const u={uid,email};demoStore.set('sess',u);return u}
  const r=await auth.signInWithEmailAndPassword(email,senha);return {uid:r.user.uid,email}
 },
 async signup(email,senha){
  email=email.trim().toLowerCase();
  if(DEMO)return API.login(email,senha);
  const r=await auth.createUserWithEmailAndPassword(email,senha);
  if(!isAdminEmail(email)){
   let ok=false;try{ok=(await db.collection('convites').doc(email).get()).exists}catch(e){ok=false}
   if(!ok){try{await r.user.delete()}catch(e){await auth.signOut()}throw new Error('Este e-mail ainda não foi convidado. Fale com o escritório para liberar seu acesso.')}
  }
  try{await r.user.sendEmailVerification()}catch(e){}
  return {uid:r.user.uid,email}
 },
 async reset(email){if(DEMO)return;await auth.sendPasswordResetEmail(email.trim().toLowerCase())},
 async logout(){if(DEMO){demoStore.set('sess',null);return}await auth.signOut()},
 async getEmp(uid){if(DEMO)return demoStore.get('emp_'+uid,null);const d=await db.collection('empresas').doc(uid).get();return d.exists?{uid,...d.data()}:null},
 async saveEmp(uid,data){if(DEMO){demoStore.set('emp_'+uid,{...(demoStore.get('emp_'+uid,{})),...data,uid});return}await db.collection('empresas').doc(uid).set(data,{merge:true})},
 async listLanc(uid,ano){
  if(DEMO)return demoStore.get('lanc_'+uid,[]).filter(l=>l.data.startsWith(ano+'-'));
  const q=await db.collection('empresas').doc(uid).collection('lanc').where('data','>=',ano+'-01-01').where('data','<=',ano+'-12-31').get();
  return q.docs.map(d=>({id:d.id,...d.data()}))},

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),2800)}
function errMsg(e){const c=e&&e.code||'';return ({
 'auth/invalid-email':'E-mail inválido.','auth/user-not-found':'E-mail ou senha incorretos.','auth/wrong-password':'E-mail ou senha incorretos.','auth/invalid-credential':'E-mail ou senha incorretos.',
 'auth/email-already-in-use':'Este e-mail já tem acesso. Use "Entrar".','auth/weak-password':'A senha precisa ter pelo menos 6 caracteres.','auth/too-many-requests':'Muitas tentativas. Espere alguns minutos.',
 'auth/network-request-failed':'Sem internet. Confira a conexão.'})[c]||e.message||'Algo deu errado. Tente de novo.'}

/* ===================== CÁLCULOS ===================== */
const doMes=(L,a,m)=>L.filter(l=>l.data.startsWith(a+'-'+pad(m)));
const soma=(L,t)=>L.filter(l=>l.tipo===t).reduce((s,l)=>s+(+l.valor||0),0);
function limiteAno(emp,ano){
 const lim=LIMITE_MEI[ano]||LIMITE_PADRAO;
 const [ay,am]=(emp.abertura||'2000-01').split('-').map(Number);
 if(ay===ano){const meses=12-am+1;return {valor:lim/12*meses,prop:true,meses}}
 return {valor:lim,prop:false,meses:12}}
function dasInfo(L){
 const d=new Date(),dia=d.getDate();let cm=d.getMonth(),cy=d.getFullYear();if(cm===0){cm=12;cy--}
 const comp=MESES[cm-1];
 const pago=L.some(l=>l.tipo==='out'&&l.cat==='das'&&(l.data.slice(0,7)===d.getFullYear()+'-'+pad(d.getMonth()+1)));
 const venc='20/'+pad(d.getMonth()+1);
 if(pago)return {st:'ok',txt:'DAS de '+comp+' pago. Tudo certo!'};
 if(dia<=20)return {st:dia>=15?'w':'n',txt:'O DAS de '+comp+' vence dia '+venc+(dia===20?' (hoje!)':', daqui a '+(20-dia)+' dia'+(20-dia>1?'s':''))+'.',comp};
 return {st:'late',txt:'O DAS de '+comp+' venceu dia '+venc+'. Se ainda não pagou, fale com o escritório para gerar a guia atualizada.',comp}}

  try{
   if(modo==='esqueci'){await API.reset(email);telaLogin('entrar','<div class="ok">Enviamos um link para o seu e-mail. Abra e crie uma senha nova.</div>');return}

function telaOnboarding(){
 const o=S.ob,st=o.step;let body='';
 if(st===1)body=`<h2>Como se chama o seu negócio?</h2><p class="mut">É o nome que seus clientes conhecem.</p>
  <label>Nome do negócio<input id="obn" value="${esc(o.nome||'')}" placeholder="Ex.: Doce Sabor"></label>`;
 if(st===2)body=`<h2>O que você faz?</h2><p class="mut">Isso organiza o seu relatório do MEI.</p><div class="opt">
  ${[['servico','Presto serviço','cabeleireira, eletricista, manicure…'],['comercio','Vendo produtos','loja, revenda, lanches prontos…'],['ambos','Os dois','vendo e também presto serviço']].map(x=>`<button data-tipo="${x[0]}" class="${o.tipo===x[0]?'on':''}"><b>${x[1]}</b><span class="mut">${x[2]}</span></button>`).join('')}</div>`;
 if(st===3)body=`<h2>Quando você abriu o MEI?</h2><p class="mut">Serve para calcular certinho o seu limite de faturamento no ano.</p>
  <label>Mês e ano de abertura<input id="oba" type="month" value="${esc(o.abertura||'')}" max="${hoje().slice(0,7)}"></label>`;
 if(st===4)body=`<h2>Quer um lembrete do DAS?</h2><p class="mut">O DAS é o imposto mensal do MEI e vence todo dia 20. A gente te avisa na tela inicial.</p>
  <div class="yn"><button data-das="1" class="${o.das!==false?'on':''}">Sim, quero</button><button data-das="0" class="${o.das===false?'on':''}">Não precisa</button></div>`;
 $('#app').innerHTML=`<div class="center"><div class="auth"><div class="logo" style="font-size:22px">JM Gestão<b>+</b></div>
  <div class="card"><div class="steps">${[1,2,3,4].map(i=>`<i class="${i<=st?'on':''}"></i>`).join('')}</div>
  <div class="stack">${body}<div id="oberr"></div>
  <div style="display:grid;grid-template-columns:${st>1?'1fr 2fr':'1fr'};gap:10px">${st>1?'<button id="obv">Voltar</button>':''}<button class="pri" id="obg">${st<4?'Continuar':'Começar a usar'}</button></div></div></div>
  <p class="mut" style="text-align:center">Passo ${st} de 4</p></div></div>`;
 const f=$('#obn')||$('#oba');if(f)f.focus();
}
async function obNext(){
 const o=S.ob,e=m=>{$('#oberr').innerHTML=`<div class="err">${m}</div>`};
 if(o.step===1){o.nome=$('#obn').value.trim();if(!o.nome)return e('Escreva o nome do negócio.')}
 if(o.step===2&&!o.tipo)return e('Escolha uma opção.');
 if(o.step===3){o.abertura=$('#oba').value;if(!o.abertura)return e('Informe o mês e o ano. Se não lembrar, use um valor aproximado.')}
 if(o.step<4){o.step++;return telaOnboarding()}
 const emp={nome:o.nome,tipo:o.tipo,abertura:o.abertura,dasLembrete:o.das!==false,email:S.user.email,dicas:{},criadoEm:hoje()};
 try{await API.saveEmp(S.user.uid,emp);S.emp={uid:S.user.uid,...emp};S.lanc=[];go('inicio');toast('Pronto! Seu app está configurado.')}
 catch(err){e(esc(errMsg(err)))}
}

 const das=dasInfo(S.lanc);if(das.st==='late'&&(S.emp.criadoEm||'').slice(0,7)===hoje().slice(0,7)){das.st='n';das.txt='Quando pagar o DAS, toque em "Já paguei" para registrar.'}

async function salvarLanc(){
 guardaCampos();const s=S.sh,v=parseValor(s.valor),e=m=>{$('#sherr').innerHTML=`<div class="err">${m}</div>`};
 if(!(v>0))return e('Digite o valor. Ex.: 150 ou 89,90');
 if(!s.cat)return e(s.tipo==='in'?'Escolha o que foi (venda, serviço…).':'Escolha com o que gastou.');
 if(!s.data||s.data>hoje())return e('Confira a data.');
 const l={tipo:s.tipo,valor:v,cat:s.cat,forma:s.forma,nota:s.tipo==='in'&&isFat({tipo:'in',cat:s.cat})?!!s.nota:false,data:s.data,desc:s.desc.trim().slice(0,80)};
 const b=$('#salvar');b.disabled=true;
 try{const n=await API.addLanc(S.user.uid,l);if(l.data.startsWith(S.ano+'-'))S.lanc.push(n);fecharSheet();render();toast((s.tipo==='in'?'Recebimento':'Pagamento')+' de '+brl(v)+' salvo!')}
 catch(err){b.disabled=false;e(esc(errMsg(err)))}}

function confirmar(txt,acao,rotulo='Apagar'){
 S.sh=null;$('#sbox').innerHTML=`<h2>${txt}</h2>${rotulo==='Desfazer'?'<p class="mut">A OS volta para "Pronto".</p>':'<p class="mut">Não dá para desfazer.</p>'}<div class="acts"><button id="shx">Cancelar</button><button class="dk" id="cfok" style="background:var(--out);border-color:var(--out)">${rotulo}</button></div>`;

async function carregarAdmin(){

 for(const e of emps){const L=await API.listLanc(e.uid,ano);e._fat=L.filter(isFat).reduce((s,l)=>s+l.valor,0);e._mes=L.filter(l=>l.data.startsWith(mesAt)&&isFat(l)).reduce((s,l)=>s+l.valor,0);

 S.admin.emps=emps;S.admin.conv=conv}

function guardaVendaCred(){const s=CR.sh;if(!$('#crcli'))return;s.cli=$('#crcli').value;s.fone=$('#crfone').value;s.desc=$('#crdesc').value;s.total=$('#crtot').value;s.entrada=$('#crent').value;s.n=$('#crn').value;s.venc=$('#crvenc').value}
async function salvarVendaCred(){
 guardaVendaCred();const s=CR.sh,e=m=>{$('#crerr').innerHTML=`<div class="err">${m}</div>`};
 const tot=parseValor(s.total),ent=s.entrada?parseValor(s.entrada):0,n=Math.max(1,parseInt(s.n)||1);
 if(!s.cli.trim())return e('Digite o nome da cliente.');if(!(tot>0))return e('Digite o valor total da venda.');if(!(ent>=0)||ent>=tot)return e('A entrada precisa ser menor que o total.');if(!s.venc)return e('Escolha o 1º vencimento.');
 const resto=Math.round((tot-ent)*100),base=Math.floor(resto/n),parcelas=[...Array(n)].map((_,i)=>({n:i+1,venc:addMes(s.venc,i),valor:(base+(i===n-1?resto-base*n:0))/100,pago:false}));
 try{
  let lancEnt=null;if(ent>0){lancEnt=await API.addLanc(S.user.uid,{tipo:'in',valor:ent,cat:'venda',forma:s.forma,nota:false,data:hoje(),desc:('Entrada crediário - '+s.cli.trim()).slice(0,80)});if(hoje().startsWith(S.ano+'-'))S.lanc.push(lancEnt)}
  const c={cli:s.cli.trim().slice(0,60),fone:s.fone.trim().slice(0,20),desc:s.desc.trim().slice(0,60),total:tot,valor:tot,entrada:ent,data:hoje(),parcelas,lancEnt:lancEnt?.id||null};
  const nv=await API.addCred(S.user.uid,c);CR.lista.push(nv);fecharSheet();CR.sh=null;render();toast('Venda de '+brl(tot)+' para '+c.cli+' salva: '+n+'× de '+brl(parcelas[0].valor));
 }catch(err){e(esc(errMsg(err)))}}
function abrirCliCred(nome){CR.sh={cli:nome,forma:'Dinheiro'};renderCliCred()}
function renderCliCred(){const nome=CR.sh.cli,k=nome.toLowerCase(),V=CR.lista.filter(c=>c.cli.toLowerCase()===k).sort((a,b)=>b.data.localeCompare(a.data)),h=hoje();
 const fone=(V.find(v=>v.fone)||{}).fone||'',ab=V.flatMap(v=>abertas(v).map(p=>({...p,vid:v.id})));const saldo=ab.reduce((s,p)=>s+p.valor,0);
 sheetCr(`<div class="hd"><h2>${esc(nome)}</h2><button class="x" id="shx" aria-label="Fechar">×</button></div>
  <p style="margin:0 0 6px">Deve <b>${brl(saldo)}</b>${ab.some(p=>p.venc<h)?` · <span class="pill p-out">tem parcela atrasada</span>`:''}</p>
  ${fone&&saldo?`<button class="w" data-crcobra="1" style="margin:6px 0 4px">Cobrar no WhatsApp</button>`:''}
  <div class="grp"><div class="t">Quando receber, como pagou?</div><div class="chips">${FORMAS.map(f=>`<button class="chip ${CR.sh.forma===f?'on':''}" data-crpf="${f}">${f}</button>`).join('')}</div></div>
  ${V.map(v=>`<div class="card" style="padding:12px 14px"><div style="display:flex;justify-content:space-between;gap:8px"><b>${dBR(v.data)} · ${brl(v.total)}</b><button class="x" data-crdel="${v.id}" aria-label="Apagar venda">🗑</button></div>
   ${v.desc?`<div class="d mut">${esc(v.desc)}</div>`:''}${v.entrada?`<div class="d mut">Entrada ${brl(v.entrada)}</div>`:''}
   ${(v.parcelas||[]).map(p=>`<div class="li" style="padding:8px 0"><div><b>${p.n}ª</b> · vence ${dBR(p.venc)}${p.pago?` <span class="pill p-in">pago ${p.dataPag?dBR(p.dataPag):''}</span>`:p.venc<h?' <span class="pill p-out">atrasada</span>':''}</div>
    <div>${p.pago?`<button class="chip" data-crdesf="${v.id}|${p.n}">Desfazer</button>`:`<span class="v" style="margin-right:6px">${brl(p.valor)}</span><button class="chip" data-crrec="${v.id}|${p.n}" style="background:var(--in);border-color:var(--in);color:#fff">Recebi</button>`}</div></div>`).join('')}</div>`).join('')}`)}
function msgCobra(nome){const k=nome.toLowerCase(),h=hoje();const ab=CR.lista.filter(c=>c.cli.toLowerCase()===k).flatMap(v=>abertas(v)).sort((a,b)=>a.venc.localeCompare(b.venc));
 const atr=ab.filter(p=>p.venc<h),prox=ab.filter(p=>p.venc>=h)[0];
 const lin=(atr.length?atr:prox?[prox]:[]).map(p=>`• ${dBR(p.venc)}: ${brl(p.valor)}`).join('\n');
 return `Oi, ${nome.split(' ')[0]}! Tudo bem? 😊\n${atr.length?'Passando para lembrar da parcela em aberto do crediário:':'Lembrete da próxima parcela do crediário:'}\n${lin}\nPode pagar por Pix ou aqui na loja. Qualquer coisa, me chama!\n${S.emp.nome}`}
async function receberParcela(vid,n){const v=CR.lista.find(x=>x.id===vid),p=v.parcelas.find(x=>x.n===+n);
 try{const l=await API.addLanc(S.user.uid,{tipo:'in',valor:p.valor,cat:'venda',forma:CR.sh.forma,nota:false,data:hoje(),desc:(`Crediário ${p.n}/${v.parcelas.length} - ${v.cli}`).slice(0,80)});if(hoje().startsWith(S.ano+'-'))S.lanc.push(l);
  const ps=v.parcelas.map(x=>x.n===p.n?{...x,pago:true,dataPag:hoje(),forma:CR.sh.forma,lancId:l.id}:x);await API.updCred(S.user.uid,v.id,{parcelas:ps});v.parcelas=ps;renderCliCred();render();toast('Parcela de '+brl(p.valor)+' recebida')}
 catch(err){toast(errMsg(err))}}

 try{if(p.lancId){await API.delLanc(S.user.uid,p.lancId);S.lanc=S.lanc.filter(x=>String(x.id)!==String(p.lancId))}
  const ps=v.parcelas.map(x=>x.n===p.n?{n:x.n,venc:x.venc,valor:x.valor,pago:false}:x);await API.updCred(S.user.uid,v.id,{parcelas:ps});v.parcelas=ps;renderCliCred();render();toast('Recebimento desfeito')}

document.addEventListener('click',async e=>{
 const t=e.target.closest('button');if(!t)return;const ds=t.dataset;
 if(ds.crnovo){abrirVendaCred();return}
 if(ds.crforma){guardaVendaCred();CR.sh.forma=ds.crforma;renderVendaCred();return}
 if(ds.crsalva){salvarVendaCred();return}
 if(ds.crtodos){S._crTodos=!S._crTodos;render();return}
 if(ds.crcli){abrirCliCred(ds.crcli);return}
 if(ds.crpf){CR.sh.forma=ds.crpf;renderCliCred();return}
 if(ds.crrec){const [v,n]=ds.crrec.split('|');receberParcela(v,n);return}
 if(ds.crdesf){const [v,n]=ds.crdesf.split('|');confirmar('Desfazer o recebimento desta parcela? Ela sai do caixa.',()=>desfazerParcela(v,n).then(()=>abrirCliCred(CR.sh?.cli||'')),'Desfazer');return}
 if(ds.crcobra){const nome=CR.sh.cli,k=nome.toLowerCase();const f=(CR.lista.find(c=>c.cli.toLowerCase()===k&&c.fone)||{}).fone;window.open('https://wa.me/'+foneWa(f)+'?text='+encodeURIComponent(msgCobra(nome)),'_blank','noopener');return}
 if(ds.crdel){const v=CR.lista.find(x=>x.id===ds.crdel);const pagos=(v.parcelas||[]).filter(p=>p.pago).length;
  confirmar('Apagar esta venda de '+brl(v.total)+'?'+(pagos||v.entrada?' O que já foi recebido continua no caixa.':''),async()=>{try{await API.delCred(S.user.uid,v.id);CR.lista=CR.lista.filter(x=>x!==v);render();toast('Venda apagada')}catch(err){toast(errMsg(err))}});return}
});

 }catch(err){$('#oserr').innerHTML=`<div class="err">${esc(errMsg(err))}</div>`}}
async function reabrirOS(){const o=OS.lista.find(x=>x.id===OS.sh.id);
 try{for(const id of (o.lancIds||[])){if(id.startsWith('cred:')){const cid=id.slice(5);const c=CR.lista.find(x=>x.id===cid);if(c&&c.parcelas.some(p=>p.pago)){toast('Já há parcela recebida no crediário: desfaça por lá antes');return}await API.delCred(S.user.uid,cid);CR.lista=CR.lista.filter(x=>x.id!==cid)}else{await API.delLanc(S.user.uid,id);S.lanc=S.lanc.filter(x=>String(x.id)!==String(id))}}
  const up={status:'pronto',entregueEm:null,forma:null,lancIds:[]};await API.updOS(S.user.uid,o.id,up);Object.assign(o,up);render();renderOS();toast('Entrega desfeita')}catch(err){toast(errMsg(err))}}
document.addEventListener('click',async e=>{
 const t=e.target.closest('button');if(!t)return;const ds=t.dataset;const O=()=>OS.lista.find(x=>x.id===OS.sh?.id);
 if(ds.ramo){escolherRamo(ds.ramo);return}
 if(t.id==='mudaramo'){sheetOS(`<div class="hd"><h2>Tipo de negócio</h2><button class="x" id="shx" aria-label="Fechar">×</button></div><div class="chips">${Object.entries(RAMOS).map(([k,r])=>`<button class="chip ${S.emp.ramo===k?'on':''}" data-ramo="${k}">${r.nome}</button>`).join('')}</div>`);return}
 if(ds.osnovo){abrirNovaOS();return}
 if(ds.ossalva){salvarNovaOS();return}
 if(ds.osf){OS.filtro=ds.osf;render();return}
 if(ds.osver){abrirOS(ds.osver);return}
 if(ds.ositipo){OS.sh.item={tipo:ds.ositipo,desc:$('#osidesc').value,valor:$('#osival').value};renderOS();return}
 if(ds.osiadd){const o=O(),d=$('#osidesc').value.trim(),v=parseValor($('#osival').value);if(!d){$('#oserr').innerHTML='<div class="err">Descreva a peça ou o serviço.</div>';return}if(!(v>0)){$('#oserr').innerHTML='<div class="err">Digite o valor.</div>';return}
  o.itens=[...(o.itens||[]),{tipo:OS.sh.item.tipo,desc:d.slice(0,60),valor:v}];try{await salvarItensOS(o);OS.sh.item={tipo:OS.sh.item.tipo,desc:'',valor:''};render();renderOS()}catch(err){toast(errMsg(err))}return}
 if(ds.osidel){const o=O();o.itens=o.itens.filter((_,i)=>i!==+ds.osidel);try{await salvarItensOS(o);render();renderOS()}catch(err){toast(errMsg(err))}return}
 if(ds.oswa){const o=O();window.open('https://wa.me/'+foneWa(o.fone)+'?text='+encodeURIComponent(msgOS(o,ds.oswa)),'_blank','noopener');return}
 if(ds.osst){const o=O();try{await API.updOS(S.user.uid,o.id,{status:ds.osst});o.status=ds.osst;render();renderOS()}catch(err){toast(errMsg(err))}return}
 if(ds.osforma){if($('#osparc'))OS.sh.parc=+$('#osparc').value;if($('#osvenc'))OS.sh.venc=$('#osvenc').value;OS.sh.forma=ds.osforma;renderOS();return}
 if(ds.osentrega){entregarOS();return}
 if(ds.osreabre){confirmar('Desfazer a entrega? O recebimento sai do caixa.',async()=>{await reabrirOS();},'Desfazer');return}
 if(ds.osdel){const o=O();confirmar('Apagar a OS #'+o.num+'?'+(o.status==='entregue'?' O que foi recebido continua no caixa.':''),async()=>{try{await API.delOS(S.user.uid,o.id);OS.lista=OS.lista.filter(x=>x!==o);render();toast('OS apagada')}catch(err){toast(errMsg(err))}});return}
});

function go(t){if(location.hash==='#'+t)render();else location.hash=t}
function render(){
 if(!S.user)return telaLogin();
 if(S.isAdmin){$('#app').innerHTML=vAdmin();bindAdmin();return}
 if(!S.emp)return telaOnboarding();
 const h=location.hash.slice(1);S.tab=abas().map(x=>x[0]).includes(h)?h:'inicio';
 $('#app').innerHTML=({inicio:vInicio,agenda:vAgenda,os:vOS,fiado:vFiado,extrato:vExtrato,relatorio:vRelatorio,ajuda:vAjuda})[S.tab]();
 const dc=$('#daschk');if(dc)dc.onchange=async()=>{S.emp.dasLembrete=dc.checked;await API.saveEmp(S.user.uid,{dasLembrete:dc.checked});toast('Preferência salva')};
}
async function mudaMes(d){S.mes+=d;if(S.mes<1){S.mes=12;S.ano--}if(S.mes>12){S.mes=1;S.ano++}
 if(!S.isAdmin&&!S.lanc.some(l=>l.data.startsWith(S.ano+'-'))){S.lanc=await API.listLanc(S.user.uid,S.ano)}render()}
function bindAdmin(){
 const f=$('#fconv');if(f)f.onsubmit=async e=>{e.preventDefault();const d=new FormData(f);try{await API.addConv(d.get('email'),d.get('nome').trim());S.admin.conv=await API.listConv();render();toast('Convite criado. Toque em "Mensagem" para enviar ao cliente.')}catch(err){toast(errMsg(err))}}}

document.addEventListener('click',async e=>{
 const t=e.target.closest('button,[data-modo]');if(!t)return;const ds=t.dataset;
 if(ds.modo){telaLogin(ds.modo);return}
 if(ds.demoent){const u={uid:ds.demoent,email:ds.demoent.replace('demo-','')+'@exemplo.com'};demoStore.set('sess',u);iniciar(u);return}
 if(t.id==='sair'){await API.logout();S.user=null;S.emp=null;S.isAdmin=false;location.hash='';if(DEMO)telaLogin();return}
 if(t.id==='obg'){obNext();return}
 if(t.id==='obv'){S.ob.step--;telaOnboarding();return}
 if(ds.tipo&&!S.emp){S.ob.tipo=ds.tipo;telaOnboarding();return}
 if(ds.das&&!S.emp){S.ob.das=ds.das==='1';telaOnboarding();return}
 if(ds.dica){S.emp.dicas={...(S.emp.dicas||{}),[ds.dica]:true};API.saveEmp(S.user.uid,{dicas:S.emp.dicas});render();return}
 if(t.id==='revdicas'){S.emp.dicas={};await API.saveEmp(S.user.uid,{dicas:{}});toast('As dicas vão aparecer de novo');go('inicio');return}
 if(ds.novo){abrirNovo(ds.novo);return}
 if(ds.das&&S.emp){abrirNovo('out',{cat:'das',desc:'DAS de '+(dasInfo(S.lanc).comp||''),valor:''});return}
 if(t.id==='shx'){fecharSheet();return}
 if(ds.cat){guardaCampos();S.sh.cat=ds.cat;if(!isFat({tipo:'in',cat:ds.cat}))S.sh.nota=false;renderSheet();return}
 if(ds.forma){guardaCampos();S.sh.forma=ds.forma;renderSheet();return}
 if(ds.nota&&S.sh){guardaCampos();S.sh.nota=ds.nota==='1';renderSheet();return}
 if(t.id==='salvar'){salvarLanc();return}
 if(ds.del){const l=S.lanc.find(x=>String(x.id)===ds.del);confirmar('Apagar '+(l.tipo==='in'?'recebimento':'pagamento')+' de '+brl(l.valor)+'?',async()=>{try{await API.delLanc(S.user.uid,l.id);S.lanc=S.lanc.filter(x=>x!==l);render();toast('Lançamento apagado')}catch(err){toast(errMsg(err))}});return}
 if(ds.mes){mudaMes(+ds.mes);return}
 if(t.id==='relcopy'){const tx=$('#relbox').innerText;try{await navigator.clipboard.writeText(tx);toast('Relatório copiado')}catch(err){toast('Não deu para copiar neste aparelho')}return}
 if(t.id==='relprint'){try{window.print()}catch(err){toast('Impressão indisponível aqui')}return}
 if(ds.ver){S.admin.sel=ds.ver;S.ano=new Date().getFullYear();S.mes=new Date().getMonth()+1;S.admin.lanc=await API.listLanc(ds.ver,S.ano);render();setTimeout(()=>$('#det')?.scrollIntoView({behavior:'smooth'}),50);return}
 if(t.id==='fechadet'){S.admin.sel=null;render();return}
 if(ds.ames){S.mes+=+ds.ames;if(S.mes<1){S.mes=12;S.ano--}if(S.mes>12){S.mes=1;S.ano++}S.admin.lanc=await API.listLanc(S.admin.sel,S.ano);render();return}
 if(ds.delconv){confirmar('Remover o convite de '+ds.delconv+'?',async()=>{await API.delConv(ds.delconv);S.admin.conv=await API.listConv();render()},'Remover');return}
 if(ds.msg){const c=S.admin.conv.find(x=>x.email===ds.msg),m=msgConvite(c);
  $('#sbox').innerHTML=`<div class="hd"><h2>Mensagem para ${esc(c.nome||c.email)}</h2><button class="x" id="shx" aria-label="Fechar">×</button></div><textarea id="msgtx" style="width:100%;min-height:220px;font:15px/1.5 Montserrat,sans-serif;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--card);color:var(--ink)">${esc(m)}</textarea><button class="pri w" id="cpmsg" style="margin-top:10px">Copiar mensagem</button>`;
  $('#sheet').classList.add('on');return}
 if(t.id==='cpmsg'){try{await navigator.clipboard.writeText($('#msgtx').value);toast('Mensagem copiada. Cole no WhatsApp do cliente.')}catch(err){$('#msgtx').select();toast('Selecionei o texto: copie com o dedo ou Ctrl+C')}return}
});
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')fecharSheet()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#sheet').classList.contains('on'))fecharSheet();if(e.key==='Enter'&&S.sh&&e.target.tagName==='INPUT'){e.preventDefault();salvarLanc()}});
window.addEventListener('hashchange',()=>{if(S.user&&!S.isAdmin&&S.emp){fecharSheet();render();scrollTo(0,0)}});

async function iniciar(u){
 S.user=u;if(!u){render();return}
 S.isAdmin=isAdminEmail(u.email);
 $('#app').innerHTML='<div class="center"><p class="mut">Carregando…</p></div>';
 try{
  if(S.isAdmin){await carregarAdmin()}
  else{S.emp=await API.getEmp(u.uid);if(S.emp){S.lanc=await API.listLanc(u.uid,S.ano);await Promise.all([carregarAgenda(),carregarCred(),carregarOS()])}}
  render()}
 catch(err){$('#app').innerHTML=`<div class="center"><div class="auth card"><div class="err">${esc(errMsg(err))}</div><button class="w" style="margin-top:12px" id="sair">Voltar</button></div></div>`}
}

(async()=>{
 if(DEMO){const b=document.createElement('div');b.className='demo';b.textContent='Demonstração';document.body.appendChild(b)}
 try{await API.init()}catch(err){$('#app').innerHTML=`<div class="center"><div class="auth card"><div class="err">${esc(errMsg(err))}</div></div></div>`;return}
 API.onUser(iniciar);
 if(!DEMO&&'serviceWorker' in navigator){try{navigator.serviceWorker.register('sw.js')}catch(e){}}
})();
}
</script>
