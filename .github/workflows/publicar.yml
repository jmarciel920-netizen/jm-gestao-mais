# Publica o site no Firebase Hosting a cada alteração na main.
# Sem chave guardada: o GitHub prova a identidade ao Google (Workload Identity Federation).
# A conta de serviço só tem o papel "Administrador do Firebase Hosting".
name: Publicar no Firebase Hosting
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency: publicar
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - run: npx --yes firebase-tools@13 deploy --only hosting --project jm-gestao-mais --non-interactive
